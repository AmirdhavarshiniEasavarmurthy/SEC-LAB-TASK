<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2: Loop Control Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f7ff;
      margin: 40px;
      color: #222;
    }

    h1 {
      text-align: center;
      color: #0056b3;
    }

    .section {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
    }

    button {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #003f8a;
    }

    pre {
      background-color: #eef3f9;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Task 2: Loop Control Practice</h1>

  <!-- while loop -->
  <div class="section">
    <h2>1️⃣ While Loop (Print 1–10)</h2>
    <button onclick="runWhileLoop()">Run</button>
    <pre id="whileOutput"></pre>
  </div>

  <!-- do-while loop -->
  <div class="section">
    <h2>2️⃣ Do-While Loop (Ask for Password)</h2>
    <input type="password" id="passwordInput" placeholder="Enter password">
    <button onclick="checkPassword()">Submit</button>
    <pre id="doWhileOutput"></pre>
  </div>

  <!-- for loop -->
  <div class="section">
    <h2>3️⃣ For Loop (Sum of First N Natural Numbers)</h2>
    <input type="number" id="numInput" placeholder="Enter N">
    <button onclick="runForLoop()">Calculate</button>
    <pre id="forOutput"></pre>
  </div>

  <!-- nested for loop -->
  <div class="section">
    <h2>4️⃣ Nested For Loop (Multiplication Table)</h2>
    <input type="number" id="tableNum" placeholder="Enter table number">
    <button onclick="runNestedLoop()">Show Table</button>
    <pre id="nestedOutput"></pre>
  </div>

  <script>

    function runWhileLoop() {
      let num = 1;
      let output = "";
      while (num <= 10) {
        output += num + " ";
        num++;
      }
      document.getElementById("whileOutput").textContent = output;
    }


    function checkPassword() {
      const correctPassword = "1234";
      let input = document.getElementById("passwordInput").value;
      let message = "";

      do {
        if (input === correctPassword) {
          message = "✅ Access granted!";
          break;
        } else {
          message = "❌ Wrong password! Try again.";
        }
      } while (input !== correctPassword);

      document.getElementById("doWhileOutput").textContent = message;
    }

    function runForLoop() {
      let N = parseInt(document.getElementById("numInput").value);
      let sum = 0;
      for (let i = 1; i <= N; i++) {
        sum += i;
      }
      document.getElementById("forOutput").textContent =
        "Sum of first " + N + " numbers = " + sum;
    }

    function runNestedLoop() {
      let n = parseInt(document.getElementById("tableNum").value);
      let output = "";

      for (let i = 1; i <= n; i++) {
        output += "Table of " + i + ":\n";
        for (let j = 1; j <= 10; j++) {
          output += i + " x " + j + " = " + (i * j) + "\n";
        }
        output += "-----------------\n";
      }

      document.getElementById("nestedOutput").textContent = output;
    }
  </script>
</body>
</html>
